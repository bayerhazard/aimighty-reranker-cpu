olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimrerqwen3vino: 1

metadata:
  name: aimrerqwen3vino
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-reranker-cpu/main/icon.png
  description: Qwen3-Reranker-0.6B via OpenVINO on CPU / Intel iGPU — Jina/Cohere-compatible /v1/rerank
  appid: aimrerqwen3vino
  title: AIM Qwen3 0.6B Reranker CPU
  version: '26.08.2'
  categories:
    - AI

entrances:
  - name: aimrerqwen3vino
    port: 8080
    host: aimrerqwen3vino
    title: AIM Qwen3 0.6B Reranker CPU
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-reranker-cpu/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.08.2'
  upgradeDescription: |
    v26.08.2: Intel accelerator support — new "intel" compute mode via spec.accelerator.
      Intel GPU runtime baked into the image (ubuntu 24.04 base, intel-opencl-icd +
      intel-level-zero-gpu + level-zero). Runs on the Core Ultra 9 275HX iGPU through
      Level Zero, ~2-2.5x faster than CPU (PoC-verified 2026-08-20). Auto device
      detection in entrypoint (GPU if render node openable, else CPU). Built for Olares 1.12.6.
    v26.08.1: Unified naming — title "AIM Qwen3 0.6B Reranker CPU", English descriptions. Built for Olares 1.12.6.
    v1.1.0: Deterministic build - OpenVINO 2026.2.1 + optimum-intel 2.0.0 pinned
      (replaces unpinned git-main), base image python:3.11-slim-bookworm. OlaresManifest
      migrated to apiVersion v3 (Olares >=1.12.6). Fixed MODEL_NAME env overriding the
      baked model cache path. Removed dev-only server.py hostPath mount. Chart now
      installable on Olares 1.12.6.
    v1.0.3: Fixed deployment title to 'Qwen3 Reranker CPU'.
    v1.0.2: Category update - moved to AI Agents.
    v1.0.1: Renamed to 'AIM Qwen3 Reranker CPU'. Fixed icon URL.
    v1.0.0: Initial stable release. Highly optimized for Intel Core Ultra 9 275HX
      hybrid architecture (8 threads on P-cores). Unlocked CPU limit to 24 cores.
      Integrated support for iGPU / NPU hardware routing.
  fullDescription: |
    Qwen3-Reranker-0.6B + OpenVINO on CPU or Intel integrated GPU (iGPU accelerator), optimized for Olares One.

    **Model**
    tomaarsen/Qwen3-Reranker-0.6B-seq-cls — a 600-million-parameter cross-encoder
    sequence classification model, INT8 quantized via Optimum Intel for efficient
    inference.

    **Inference Engine**
    OpenVINO 2026.2.1 (pinned) with Hugging Face Transformers 4.55.4 and optimum-intel
    2.0.0. Runs on the Intel Core Ultra 9 275HX CPU or the integrated GPU through the
    Level Zero driver ("intel" compute mode).

    **Key Features**
    - Jina/Cohere-compatible API endpoints: /v1/rerank, /rerank, /v1/models, /health
    - Dynamic shapes, async endpoints, and multicore scaling using OpenVINO TBB
    - Model pre-converted and baked into the image (deterministic, pinned build)
    - Built-in HTML dashboard on root endpoint (/)
    - Compute modes: cpu (default) and intel (iGPU accelerator, ~2-2.5x faster)

    **Resource Usage**
    RAM: 16 GB, CPU: 24 cores
    Disk: 10 GB
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-reranker-cpu
  sourceCode: https://github.com/bayerhazard/aimighty-reranker-cpu
  supportArch:
    - amd64
  accelerator:
    - mode: cpu
      requiredCpu: "5"
      limitedCpu: "25"
      requiredMemory: 16Gi
      limitedMemory: 17Gi
      requiredDisk: 10Gi
      limitedDisk: 10Gi
    - mode: intel
      requiredCpu: "5"
      limitedCpu: "25"
      requiredMemory: 16Gi
      limitedMemory: 17Gi
      requiredDisk: 10Gi
      limitedDisk: 10Gi

permission:
  appData: true

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
